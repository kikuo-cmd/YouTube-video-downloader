<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #333;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ff0000;
    }
    button {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #cc0000;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #preview {
      margin-top: 20px;
      display: none;
    }
    #preview img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    #preview h3 {
      font-size: 16px;
      color: #222;
      margin: 0 0 15px 0;
      text-align: left;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YouTube Downloader</h1>
    
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="fetchBtn" onclick="getVideoInfo()">動画情報を取得</button>
    </div>

    <div id="status" class="status"></div>

    <div id="preview">
      <img id="thumbnail" src="" alt="サムネイル">
      <h3 id="videoTitle"></h3>
      <button id="downloadBtn" onclick="startDownload()">動画をダウンロード (.mp4)</button>
    </div>
  </div>

  <script>
    const API_BASE = "";
    let currentUrl = "";

    async function getVideoInfo() {
      const urlInput = document.getElementById("videoUrl").value.trim();
      const statusDiv = document.getElementById("status");
      const previewDiv = document.getElementById("preview");
      const fetchBtn = document.getElementById("fetchBtn");

      if (!urlInput) {
        alert("YouTubeのURLを入力してください。");
        return;
      }

      statusDiv.innerText = "動画情報を取得中...";
      previewDiv.style.display = "none";
      fetchBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/info?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "情報の取得に失敗しました。");
        }

        document.getElementById("thumbnail").src = data.thumbnail;
        document.getElementById("videoTitle").innerText = data.title;
        previewDiv.style.display = "block";
        statusDiv.innerText = "";
        currentUrl = urlInput;
      } catch (err) {
        statusDiv.innerText = `エラー: ${err.message}`;
      } finally {
        fetchBtn.disabled = false;
      }
    }

    function startDownload() {
      if (!currentUrl) return;
      
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "ダウンロードを開始します。完了までそのままお待ちください...";

      window.location.href = `${API_BASE}/api/download?url=${encodeURIComponent(currentUrl)}`;
    }
  </script>
</body>
</html>
